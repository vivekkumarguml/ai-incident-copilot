name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    # =========================
    # Docker Login
    # =========================

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # =========================
    # Build Backend
    # =========================

    - name: Build Backend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-backend:latest ./backend

    - name: Push Backend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-backend:latest

    # =========================
    # Build Frontend
    # =========================

    - name: Build Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-frontend:latest ./frontend

    - name: Push Frontend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-frontend:latest

    # =========================
    # Deploy to EC2
    # =========================

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master

      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          docker pull ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-backend:latest

          docker pull ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-frontend:latest

          docker stop backend || true
          docker rm backend || true

          docker stop frontend || true
          docker rm frontend || true

          docker run -d \
            --name backend \
            -p 8000:8000 \
            -e MONGO_URI='${{ secrets.MONGO_URI }}' \
            -e GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
            ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-backend:latest

          docker run -d \
            --name frontend \
            -p 80:80 \
            ${{ secrets.DOCKER_USERNAME }}/ai-incident-copilot-frontend:latest