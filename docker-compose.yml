services:

  backend:
    build: ./backend
    container_name: aiincident-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aiincident-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped